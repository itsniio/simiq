[project]
name = "simiq-fit"
version = "0.1.0"
description = "simiq fit engine: body from inputs (Anny), riding-pose measurements, fabric strain, size recommendation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anny>=0.6",
    "torch>=2.4",
    "numpy>=2",
    "trimesh>=4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "matplotlib>=3.9",  # renders for the Anny spike (scripts/anny_spike.py)
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

# CI runs on Linux, where the default PyTorch wheel pulls ~2 GB of CUDA libraries the engine never uses.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
