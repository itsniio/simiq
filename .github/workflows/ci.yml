name: CI

# This repository is public, so it runs on GitHub-hosted runners. The org's
# self-hosted runner is not available to public repositories and must never
# run code from forks.
#
# The web/ job (vitest, eslint, size budgets, audit) is added by the task that
# creates that directory (tryon-viewer-mvp 3.1).
on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  spec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # OpenSpec is pinned so a CLI release cannot change what "valid" means under a PR.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate the OpenSpec changes and specs
        run: npx --yes @fission-ai/openspec@1.14.1 validate --all --strict

  privacy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Study data must never reach this public repository (CLAUDE.md, Constraints).
      - name: Refuse files under data/private/
        run: |
          if git ls-files | grep -q '^data/private/'; then
            echo "::error title=Personal data::files under data/private/ are tracked"
            git ls-files | grep '^data/private/'
            exit 1
          fi

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # --locked fails the job when uv.lock does not match pyproject.toml.
      - name: Install
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check

      - name: Pytest
        run: uv run pytest

      - name: Audit dependencies
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

      # Soft target, reported only (CLAUDE.md, Simplicity).
      - name: Product code size
        run: |
          lines=$(find src -name '*.py' -print0 | xargs -0 cat | wc -l)
          echo "engine/src: $lines lines of the 6,000-line soft target for product code" >> "$GITHUB_STEP_SUMMARY"
